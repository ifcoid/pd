[package]
name = "pd"
version = "0.1.4"
edition = "2024"
description = "Ultra-lightweight pure-Rust offline PDF reader & desktop utility (View, PDF to Images, Images to PDF, Merge, Split, Compress)"
homepage = "https://if.co.id/pd/"
repository = "https://github.com/ifcoid/pd"
license = "MIT"
keywords = ["pdf", "pdf-reader", "utility", "gui", "iced", "offline"]
categories = ["command-line-utilities", "gui"]

[dependencies]
anyhow = "1.0.104"
flate2 = "1.0"
hayro = "0.8.0"
iced = { version = "0.14.0", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.45.0"
rfd = "0.17.2"
