name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version for release (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pd.exe
            archive_name: pd-windows-x86_64.zip
            use_zip: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pd
            archive_name: pd-linux-x86_64.tar.gz
            use_zip: false

          - os: macos-latest
            target: x86_64-apple-darwin
            binary: pd
            archive_name: pd-macos-x86_64.tar.gz
            use_zip: false

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: pd
            archive_name: pd-macos-aarch64.tar.gz
            use_zip: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Binary (ZIP)
        if: matrix.use_zip
        shell: pwsh
        run: |
          $binPath = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          Copy-Item $binPath .
          Compress-Archive -Path "${{ matrix.binary }}", "README.md", "LICENSE" -DestinationPath "${{ matrix.archive_name }}" -Force
          (Get-FileHash -Algorithm SHA256 "${{ matrix.archive_name }}").Hash.ToLower() > "${{ matrix.archive_name }}.sha256"

      - name: Package Unix Binary (tar.gz)
        if: "!matrix.use_zip"
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          chmod +x "$BIN_PATH"
          cp "$BIN_PATH" .
          tar -czvf "${{ matrix.archive_name }}" "${{ matrix.binary }}" README.md LICENSE
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive_name }}" | cut -d ' ' -f 1 > "${{ matrix.archive_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive_name }}" | cut -d ' ' -f 1 > "${{ matrix.archive_name }}.sha256"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files

      - name: Determine Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f 2)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "PD - Desktop PDF Utility ${{ steps.tag_info.outputs.tag }}"
          body: |
            ## PD - Desktop PDF Utility ${{ steps.tag_info.outputs.tag }}
            
            Aplikasi desktop cross-platform cepat, aman, dan offline-first untuk memanipulasi dokumen PDF (Merge, Split, Compress).

            ### 📦 Download Assets:
            - **Windows (x86_64)**: `pd-windows-x86_64.zip`
            - **Linux (x86_64)**: `pd-linux-x86_64.tar.gz`
            - **macOS Apple Silicon (ARM64)**: `pd-macos-aarch64.tar.gz`
            - **macOS Intel (x86_64)**: `pd-macos-x86_64.tar.gz`

            ### 🚀 Quick Install:
            - **Windows (PowerShell)**:
              ```powershell
              irm https://raw.githubusercontent.com/ifcoid/pd/main/install.ps1 | iex
              ```
            - **Linux / macOS (Shell)**:
              ```bash
              curl -fsSL https://raw.githubusercontent.com/ifcoid/pd/main/install.sh | bash
              ```
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
